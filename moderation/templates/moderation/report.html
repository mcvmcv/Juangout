{% extends "base.html" %}

{% block title %}Report a post · Juangout{% endblock %}

{% block content %}
  <h1>Report this post</h1>
  {% include "posts/_post.html" %}
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Send report</button>
    <a href="{{ post.get_absolute_url }}">Cancel</a>
  </form>
{% endblock %}
