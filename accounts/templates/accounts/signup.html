{% extends "base.html" %}

{% block title %}Sign up · Juangout{% endblock %}

{% block content %}
  <h1>Join Juangout</h1>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Sign up</button>
  </form>
  <p class="aside">Already a member? <a href="{% url 'login' %}">Log in</a>.</p>
{% endblock %}
