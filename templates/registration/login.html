{% extends "base.html" %}

{% block title %}Log in · Juangout{% endblock %}

{% block content %}
  <h1>Log in</h1>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
  <p class="aside">New here? <a href="{% url 'accounts:signup' %}">Sign up</a>.</p>
{% endblock %}
