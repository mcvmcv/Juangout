<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Juangout{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="{% url 'posts:timeline' %}">Juangout</a>
    <nav>
      <a href="{% url 'posts:timeline' %}">Home</a>
      <a href="{% url 'about' %}">About</a>
      {% if user.is_authenticated %}
        <a href="{{ user.get_absolute_url }}">@{{ user.username }}</a>
        <a href="{% url 'accounts:profile_edit' %}">Edit profile</a>
        <form method="post" action="{% url 'logout' %}" class="inline">
          {% csrf_token %}<button type="submit" class="link">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Log in</a>
        <a href="{% url 'accounts:signup' %}">Sign up</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for message in messages %}<p class="msg {{ message.tags }}">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">Made with Juango</footer>
</body>
</html>
